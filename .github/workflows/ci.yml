name: C++ CMake CI

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/
          retention-days: 7

  test:
    needs: build

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/

      - name: Set execute permission
        if: runner.os != 'Windows'
        run: chmod +x build/MyProject

      - name: Run Tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  package:
    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Download Release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: build-*-Release
          path: artifacts/
          merge-multiple: false

      - name: List artifacts
        run: |
          find artifacts -type f

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: all-release-builds
          path: artifacts/
          retention-days: 7

  release:
    needs: package

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v6
        with:
          name: build-${{ matrix.os }}-Release
          path: release/

      - name: Prepare Release Package
        shell: bash
        run: |
          mkdir package

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp release/Release/MyProject.exe package/
            cp release/Release/MathLib.dll package/
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp release/MyProject package/
            cp release/libMathLib.so package/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp release/MyProject package/
            cp release/libMathLib.dylib package/
          fi

      - name: Create ZIP
        shell: bash
        run: |
          7z a MyProject-${{ runner.os }}-Release.zip ./package/*

      - name: Upload Release Package
        uses: actions/upload-artifact@v6
        with:
          name: MyProject-${{ runner.os }}-Release
          path: MyProject-${{ runner.os }}-Release.zip
          retention-days: 7
