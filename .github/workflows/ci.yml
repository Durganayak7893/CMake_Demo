name: CMake CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install CMake
        run: |
          sudo apt update
          sudo apt install -y cmake g++

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build project
        run: cmake --build build
